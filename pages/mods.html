<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOD专区 - 极速游戏库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff6600'/%3E%3Ctext x='32' y='45' font-family='Arial' font-size='36' font-weight='bold' fill='%23fff' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/home.css">
</head>
<body>
<header>
  <div class="top-bar">
    <div class="header-left">
      <div class="logo"><a href="../index.html">极速游戏库</a></div>
    </div>
    <div class="search-container">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索游戏名称，寻找MOD..." autocomplete="off">
        <button id="searchBtn" type="button">搜索</button>
      </div>
    </div>
  </div>
</header>

<div class="nav">
  <div class="mobile-nav-wrapper">
    <select class="mobile-nav-select" id="mobileNavSelect">
      <option value="../index.html">🏠 首页</option>
      <option value="../index.html?cat=单机游戏">单机游戏</option>
      <option value="../index.html?cat=热门大作">热门大作</option>
      <option value="mods.html" selected>补丁MOD</option>
    </select>
  </div>
  <div class="nav-inner" id="navBar">
    <a href="../index.html">首页</a>
    <a href="javascript:void(0)" data-category="单机游戏">单机游戏</a>
    <a href="javascript:void(0)" data-category="热门大作">热门大作</a>
    <a href="javascript:void(0)" data-category="角色扮演">角色扮演</a>
    <a href="javascript:void(0)" data-category="动作射击">动作射击</a>
    <a href="javascript:void(0)" data-category="策略模拟">策略模拟</a>
    <a href="javascript:void(0)" data-category="休闲独立">休闲独立</a>
    <a href="mods.html" class="active">补丁MOD</a>
  </div>
</div>

<div class="container">
  <div class="main">
    <div class="main-box">
      <div class="section-title">🎮 请选择游戏进入 MOD 中心</div>
      <div id="modGameList" class="game-grid"></div>
    </div>
  </div>
  <div class="sidebar">
    <div class="side-box">
      <div class="side-title">💡 关于 MOD</div>
      <div style="font-size:14px; color:var(--text-dim); line-height:1.8;">
        点击上面的游戏，即可进入该游戏专属的 MOD 列表。<br>
        我们整理了各类必备工具、画质补丁和扩展内容，并提供官方或最稳定的下载源。
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-grid">
    <div class="footer-col"><h4>关于极速游戏库</h4><p>一个纯粹、极简、无广告的单机游戏分享站。</p></div>
    <div class="footer-col"><h4>快捷链接</h4><ul><li><a href="../index.html">返回首页</a></li><li><a href="mods.html">MOD专区</a></li></ul></div>
  </div>
  <div class="footer-bottom">© 2026 极速游戏库</div>
</footer>

<script src="../js/common.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    fetch('../data/mods.json')
      .then(res => res.json())
      .then(data => {
        var container = document.getElementById('modGameList');
        var html = data.map(game => `
          <a href="mod-game.html?id=${game.id}" class="game-card">
            <img src="${game.cover}" alt="${game.name}" loading="lazy">
            <div class="game-card-info">
              <h4>${game.name}</h4>
              <p>收录 ${game.mod_count} 个 MOD</p>
            </div>
          </a>
        `).join('');
        container.innerHTML = html;
      });
  });
</script>
</body>
</html>
